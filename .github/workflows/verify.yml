name: Recipe checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ['skeleton@*', 'recipes/*']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:9.0.4-resolute
        ports: ['27017:27017']
        options: --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'" --health-interval 5s --health-retries 20
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/recipe-checks
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/recipe-checks
      MONGO_DATABASE: recipe-checks
      MONGO_DATABASE_TEST: recipe-checks-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Native build and database integration checks
        run: ./gradlew check integrationTest --no-daemon --max-workers=2
