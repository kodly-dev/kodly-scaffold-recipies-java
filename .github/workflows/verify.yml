name: Recipe checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ['skeleton@*', 'recipes/*']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:9.0.4-resolute
        ports: ['27017:27017']
        options: --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'" --health-interval 5s --health-retries 20
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: recipe_checks_test
          POSTGRES_USER: recipe
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U recipe -d recipe_checks_test" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/recipe-checks
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/recipe-checks
      MONGO_DATABASE: recipe-checks
      MONGO_DATABASE_TEST: recipe-checks-test
      SQL_URL: jdbc:postgresql://127.0.0.1:5432/recipe_checks
      SQL_USERNAME: recipe
      SQL_PASSWORD: fixture-only
      SQL_URL_TEST: jdbc:postgresql://127.0.0.1:5432/recipe_checks_test
      SQL_USERNAME_TEST: recipe
      SQL_PASSWORD_TEST: fixture-only
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_URL_TEST: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Native build and database integration checks
        run: ./gradlew check integrationTest --no-daemon --max-workers=2
      - name: Build generated projects with the published scaffolder
        env:
          KODLY_SCAFFOLDER_MODULE: ${{ runner.temp }}/kodly-scaffolder/node_modules/@kodly.dev/scaffolder/dist/index.js
        run: |
          npm install --prefix "$RUNNER_TEMP/kodly-scaffolder" --no-save --ignore-scripts @kodly.dev/scaffolder@1.0.2
          node --test scripts/test-generated-builds.mjs
