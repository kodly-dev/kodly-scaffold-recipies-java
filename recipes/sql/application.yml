spring:
  datasource:
    url: ${SQL_URL:jdbc:postgresql://localhost:5432/template-base}
    username: ${SQL_USERNAME:postgres}
    password: ${SQL_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
